steps:
- name: 'us-east1-docker.pkg.dev/overleaf-ops/ol-docker/deb-builder:csh-testing'
  env: 
  - 'DEBIAN_FRONTEND=noninteractive'
  script: |
    #!/usr/bin/env bash
    mkdir /tmp/librdb
    cp -r  /workspace/. /tmp/librdb
    cd /tmp/librdb
    origtargz
    sudo apt-get update
    mk-build-deps -i --tool="apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends --yes" --root-cmd=sudo --remove
    debuild